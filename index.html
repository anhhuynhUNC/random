    img {
        position: relative;
        width: 50%;
        top: 0px;
        left: 0;
        right: 0;
        margin-inline: auto;
    }

    #pic {
        position: absolute;
        top: -100%
    }

    #pic.active {
        transition: all 1s ease-out;
        top: 200px;
    }

    #gif.active {
        transition: all 1s ease-out;
        top: -2000px;
    }

    button {
        border-radius: 15px;
        vertical-align: top;
        border: none;
        min-height: 50px;
        background-color: rgb(255, 218, 224);
        white-space: normal !important;
        word-wrap: break-word;
        text-align: inherit;
        width: 20%;
        font-family: inherit;
        display: inline-block;
        margin: 20px;
    }

    button:hover {
        cursor: pointer;
    }
</style>

<script type="text/javascript">
    let count = 0;
    let noButton = document.getElementById("button-no");
    let yesButton = document.getElementById("button-yes");

    noButton.addEventListener("click", (event) => {
        if (count === 5) {
            noButton.parentNode.removeChild(noButton);
            return;
        }
        let sheesh = "";
        for (let i = 0; i < count; i++) {
            sheesh += "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee";
        }
        noButton.innerText = `No 😣 (Sheee${sheesh}sh)`
        count++
    })

    yesButton.addEventListener("click", (event) => {
        let text = document.createElement("h2");
        text.innerText = "Yay!! 🥰🥰🥰🥰🥰🥰🥰🥰🥰🥰🥰🥰🥰";
        document.getElementById("yes-div").appendChild(text);

        document.getElementById("gif").classList.add("active");
        document.getElementById("pic").classList.add("active");

        yesButton.parentNode.removeChild(yesButton);
        noButton.parentNode.removeChild(noButton);
    })
</script>
